[package]
name = "sigil-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
build = "build.rs"

[lib]
# `libsigil` — the C ABI shared-library artifact (spec §4). Re-exports the
# `zig_tiktoken_*` ABI documented in `bindings/c/sigil_tiktoken.h` so FFI
# consumers can link a Rust-produced artifact instead of the raw Zig build.
name = "sigil"
# staticlib + scripts/build_ffi_shared.sh produce libsigil.{so,dylib,dll}.
# rustc version-scripts every cdylib on GNU targets (local: *), which would
# localize the re-exported zig_tiktoken_* ABI — so the final link is done
# explicitly, outside rustc's export control.
crate-type = ["staticlib", "rlib"]

[dependencies]
