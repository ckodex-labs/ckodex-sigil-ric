[package]
name = "sigil-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sigil-core = { path = "../sigil-core" }
sigil-mcp = { path = "../sigil-mcp" }
sigil-probe = { path = "../sigil-probe" }
sigil-multimodal = { path = "../sigil-multimodal" }
sigil-s = { path = "../sigil-s" }
sigil-perception = { version = "0.3.0", path = "../sigil-perception" }
sigil-sigstore = { version = "0.3.0", path = "../sigil-sigstore" }
sigil-vt = { version = "0.3.0", path = "../sigil-vt", optional = true }
clap_complete = "4.5.67"

[features]
# `vt` injects the Ghostty-backed terminal-escape scanner when
# `[scan.terminal_escapes] enabled = true`. Opt-in: building it requires
# zig 0.15.2 (libghostty-vt-sys compiles ghostty's C lib) and network
# access to fetch the pinned ghostty source. A CLI built without it still
# honors the policy — the kernel records `TerminalStatus::Skipped`
# ("no scanner injected") as visible evidence rather than silently passing.
vt = ["dep:sigil-vt"]

[dev-dependencies]
tempfile = "3"
