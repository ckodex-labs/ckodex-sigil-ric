[package]
name = "sigil-vt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sigil-core = { path = "../sigil-core" }
# Upstream cross-check only — the `conformance` feature compares our
# OSC table against ghostty's fuzzed parser. Optional because building
# it needs rust >= 1.90 + zig 0.15.2 + a ghostty source fetch; none of
# that reaches the default build.
libghostty-vt = { version = "=0.2.1", optional = true }

[features]
conformance = ["dep:libghostty-vt"]
