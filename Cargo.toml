[workspace]
members = [
    "crates/sigil-core",
    "crates/sigil-mcp",
    "crates/sigil-probe",
    "crates/sigil-multimodal",
    "crates/sigil-perception",
    "crates/sigil-sigstore",
    "crates/sigil-s",
    "crates/sigil-cli",
    "crates/sigil-server",
    "crates/sigil-ffi",
    "crates/sigil-vt",
]
# The Dagger CI driver is tooling, not product — own lockfile, own MSRV.
exclude = ["ci"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
license-file = "LICENSE"

[workspace.dependencies]
anyhow = "1"
aho-corasick = "1"
clap = { version = "4", features = ["derive"] }
once_cell = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
unicode-normalization = "0.1"
unicode-segmentation = "1"
