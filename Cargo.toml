[workspace]
members = [
    "crates/sigil-core",
    "crates/sigil-mcp",
    "crates/sigil-probe",
    "crates/sigil-multimodal",
    "crates/sigil-perception",
    "crates/sigil-sigstore",
    "crates/sigil-s",
    "crates/sigil-cli",
    "crates/sigil-server",
    "crates/sigil-ffi",
    "crates/sigil-vt",
]
# The Dagger CI driver is tooling, not product — own lockfile, own MSRV.
exclude = ["ci"]
resolver = "2"

[workspace.package]
version = "0.3.2"
edition = "2021"
rust-version = "1.88"
license-file = "LICENSE"

# Workspace-wide lint floor. `unsafe` is denied everywhere; the two FFI
# boundaries (sigil-core::tokenizer_ffi, sigil-ffi exports) carry scoped allows
# with reasons, and every unsafe block must say why it is sound.
[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
mod_module_files = "deny"

[workspace.dependencies]
anyhow = "1"
aho-corasick = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
unicode-normalization = "0.1"
unicode-segmentation = "1"
