name: Feature request
description: A new capability, profile, adapter or rule.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can an attacker or an operator not do (or do too easily) today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What SIGIL should do. Note any change to a signed message or serialized form.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: How it would be verified
      description: The reference implementation or attack that a test would use.
