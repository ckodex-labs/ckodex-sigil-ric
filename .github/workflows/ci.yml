name: CI

on:
  pull_request:
  push:

permissions:
  contents: read
  issues: write
  pull-requests: write

# New pushes supersede in-flight runs of the same ref; PR runs cancel
# per-branch. Runs queue rather than stack.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Thin runners — every job delegates to the Dagger Rust driver in ci/.
# Pipeline logic lives in ci/src/stages.rs; reproduce any lane locally
# with: dagger run cargo run --manifest-path ci/Cargo.toml -- <stage>

env:
  DAGGER_DRIVER: cargo run --release --manifest-path ci/Cargo.toml --

jobs:
  verify:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain (CI driver only — gates run in containers)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache CI driver build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ci

      - name: Verify lane (contracts, fmt, clippy, test, zig, coverage, reports)
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.21.8"
          verb: run
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          args: ${{ env.DAGGER_DRIVER }} all

      - name: Publish summaries
        if: always()
        run: |
          for report in qa-scorecard.generated launch-readiness.generated \
                        burn-in-smoke.generated staged-rollout-smoke.generated; do
            {
              echo "## SIGIL ${report}"
              echo
              if [ -f "ci-out/${report}.md" ]; then
                cat "ci-out/${report}.md"
              else
                echo "_not generated — lane failed before export_"
              fi
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload reports + coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-reports
          path: ci-out/
          if-no-files-found: warn

      - name: Publish QA scorecard comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          SCORECARD_COMMENT_PATH: ci-out/qa-scorecard.comment.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- sigil-qa-scorecard -->';
            const body = fs.readFileSync(process.env.SCORECARD_COMMENT_PATH, 'utf8');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  benchmark:
    name: Benchmark regression
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [small, medium]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain (CI driver only)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache CI driver build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ci

      - name: Bench ${{ matrix.preset }}
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.21.8"
          verb: run
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          args: ${{ env.DAGGER_DRIVER }} bench ${{ matrix.preset }}

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.preset }}
          path: ci-out/bench-${{ matrix.preset }}.json
          if-no-files-found: error

  bindings:
    name: Binding smoke tests
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain (CI driver only)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache CI driver build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ci

      - name: Bindings lane (zig + python + wasm + go)
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.21.8"
          verb: run
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          args: ${{ env.DAGGER_DRIVER }} bindings

  vt-conformance:
    # Cross-checks sigil-vt against libghostty-vt (the `conformance`
    # feature): the owned OSC table vs its fuzzed parser, and every
    # modeled window op vs its real `Terminal` — cell-for-cell grid
    # parity plus a seeded differential fuzz. libghostty-vt needs rust
    # >= 1.90 and zig 0.15.2 for its pinned ghostty source — confined to
    # this lane; the runtime path never touches the FFI dep.
    name: OSC + window-model conformance vs ghostty
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain (CI driver only)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache CI driver build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ci

      - name: Conformance lane (rust 1.90 + zig 0.15.2 in-container)
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.21.8"
          verb: run
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          args: ${{ env.DAGGER_DRIVER }} conformance
