name: Benchmark Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Scheduled runs queue rather than overlap — a slow nightly must not
# stack against the next cron tick.
concurrency:
  group: benchmark-nightly
  cancel-in-progress: false

# Thin runner — the trend pipeline lives in the Dagger driver
# (ci/src/stages.rs::bench_nightly). Reproduce locally:
#   dagger run cargo run --manifest-path ci/Cargo.toml -- bench-nightly

jobs:
  stress-benchmark:
    name: Stress benchmark trend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain (CI driver only)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache CI driver build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ci

      - name: Nightly lane (3 presets + telemetry + burn-in + rollout)
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.21.8"
          verb: run
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          args: cargo run --release --manifest-path ci/Cargo.toml -- bench-nightly

      - name: Publish burn-in summary
        run: |
          {
            echo "## SIGIL Burn-In"
            echo
            cat ci-out/nightly/burn-in.md
            echo
            echo "## SIGIL Staged Rollout Readiness"
            echo
            cat ci-out/nightly/staged-rollout.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-stress-${{ github.run_id }}
          path: ci-out/nightly/
          if-no-files-found: error
