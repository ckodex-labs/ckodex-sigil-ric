name: Benchmark Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Scheduled runs queue rather than overlap — a slow nightly must not
# stack against the next cron tick.
concurrency:
  group: benchmark-nightly
  cancel-in-progress: false

# Thin runner — the trend pipeline lives in the Dagger driver
# (ci/src/stages.rs::bench_nightly). Reproduce locally:
#   dagger run cargo run --manifest-path ci/Cargo.toml -- bench-nightly

jobs:
  stress-benchmark:
    name: Stress benchmark trend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Rust toolchain (CI driver only)
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-23
        with:
          toolchain: stable

      - name: Cache CI driver build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ci

      - name: Nightly lane (3 presets + telemetry + burn-in + rollout)
        uses: dagger/dagger-for-github@b81317a976cb7f7125469707321849737cd1b3bc # v7.0.6
        with:
          version: "0.21.8"
          verb: run
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          args: cargo run --release --manifest-path ci/Cargo.toml -- bench-nightly

      - name: Publish burn-in summary
        run: |
          {
            echo "## SIGIL Burn-In"
            echo
            cat ci-out/nightly/burn-in.md
            echo
            echo "## SIGIL Staged Rollout Readiness"
            echo
            cat ci-out/nightly/staged-rollout.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-stress-${{ github.run_id }}
          path: ci-out/nightly/
          if-no-files-found: error
