name: Release

# A pushed version tag builds, signs and publishes a GitHub release.
# Build logic lives in the Dagger driver (ci/src/stages.rs: release, sbom);
# this workflow only moves artifacts and signs them. Signing is keyless:
# Sigstore certificates are bound to this workflow's GitHub OIDC identity,
# so no signing key exists to leak. Verify with docs/RELEASE-VERIFICATION.md.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DAGGER_VERSION: "0.21.12"
  DAGGER_DRIVER: cargo run --release --manifest-path ci/Cargo.toml --

jobs:
  verify:
    name: Verify lane on the tagged commit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-23
        with:
          toolchain: stable
      - name: The tag names the workspace version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test "v$version" = "$TAG" || { echo "tag $TAG but Cargo.toml says $version" >&2; exit 1; }
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          verb: run
          args: ${{ env.DAGGER_DRIVER }} all

  build:
    name: Build ${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-23
        with:
          toolchain: stable
      - name: Build release archive (Dagger)
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          verb: run
          args: ${{ env.DAGGER_DRIVER }} release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  sbom:
    name: SBOM
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-23
        with:
          toolchain: stable
      - name: CycloneDX SBOM (Dagger, syft)
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          verb: run
          args: ${{ env.DAGGER_DRIVER }} sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sbom
          path: dist/
          if-no-files-found: error

  publish:
    name: Sign and publish
    needs: [build, sbom]
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the release
      id-token: write      # Sigstore keyless signing and attestations
      attestations: write  # SLSA provenance and SBOM attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "number=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Checksums
        working-directory: dist
        run: |
          cat ./*.tar.gz.sha384 > SHA384SUMS
          sha256sum ./*.tar.gz ./*.cdx.json > SHA256SUMS
          sha384sum --check SHA384SUMS
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: SBOM attestation
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/sigil-${{ steps.version.outputs.number }}.cdx.json
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Sigstore signatures
        working-directory: dist
        run: |
          for f in ./*.tar.gz ./*.cdx.json SHA384SUMS SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release_notes.py "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "SIGIL $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" dist/*
